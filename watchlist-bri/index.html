<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light only">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BRI Watchlist Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: calm enterprise banking tool, clinical and trustworthy
   IDEA: the AML analyst's operational console: spreadsheet grids + approval ledger
   PICTURE: the working tool itself; the grid is the hero
   COLOUR and TYPE: BRI Nusantara #0857C3, Cakrawala #307FE2, Mentari #71C5EB, white; Inter
   LAYOUT: collapsible sidebar, fixed topbar, rounded cards on soft ground */
:root,:root[data-theme]{color-scheme:light only;
--bg:#f7fafe;--card:#fff;--ink:#0f1e33;--mute:#64748b;
--line:#e3e9f1;--grid:#d3e1f3;--head:#eef5fd;
--blue:#0857C3;--blue2:#307FE2;--mentari:#71C5EB;--sky:#e9f5fc;--orange:#f28c1b;
--ok:#0d8a55;--okb:#e3f6ec;--warn:#b86e00;--warnb:#fff4e0;
--err:#c62f2f;--errb:#fdecec;--null:#a9b4c3}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:light}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,sans-serif;overflow:hidden;height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app{display:flex;height:100vh}
/* sidebar */
.side{width:272px;flex:none;background:#fff;border-right:1px solid var(--line);color:var(--ink);display:flex;flex-direction:column;transition:width .2s,margin .2s;overflow:hidden}
.side.col{width:72px}.side.hid{margin-left:-273px}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px;height:68px}
.mark{width:36px;height:36px;border-radius:10px;background:#0857C3;color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.brand b{display:block;color:#0857C3;font-size:16px;line-height:1.1}.brand small{font-size:10.5px;color:#307FE2;letter-spacing:.04em;white-space:nowrap}
.navl{font-size:11px;color:var(--mute);padding:10px 22px 6px;white-space:nowrap}
.nav{padding:0 12px;display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:#334155;text-decoration:none;white-space:nowrap;position:relative;cursor:pointer}
.nav a:hover{background:#eef5fd;color:#0857C3}.nav a.on{background:#e9f5fc;color:#0857C3;font-weight:600;box-shadow:inset 3px 0 0 #0857C3}
.nav .badge{margin-left:auto;font-style:normal}.nav span{overflow:hidden;text-overflow:ellipsis}
em.badge{font-style:normal}
.side.col .navl,.side.col .brand div,.side.col .nav span,.side.col .nav .badge,.side.col .sfoot p{display:none}
.side.col .nav a{justify-content:center}.side.col .brand{justify-content:center;padding:18px 0}
.side.col .nav a:hover::after{content:attr(data-t);position:fixed;left:78px;background:var(--ink);color:var(--bg);padding:4px 10px;border-radius:6px;font-size:12px;z-index:50}
.sfoot{margin-top:auto;padding:12px;border-top:1px solid var(--line)}
.sfoot button{width:100%;display:flex;align-items:center;gap:10px;justify-content:center;background:none;border:1px solid var(--line);border-radius:10px;padding:8px;color:var(--mute)}.sfoot button:hover{background:#eef5fd;color:#0857C3}
.sfoot p{margin:0 0 8px;font-size:12px;color:var(--mute);padding:0 4px}
/* main */
.main{flex:1;display:flex;flex-direction:column;height:100vh}
.top{height:64px;flex:none;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 20px}
.ib{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;position:relative}
.ib:hover{background:var(--head)}
.crumb{font-size:12px;color:var(--mute)}.crumb b{display:block;font-size:16px;color:var(--ink)}
.top .sp{flex:1}
.dot{position:absolute;top:6px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--orange);border:2px solid var(--card)}
.user{display:flex;align-items:center;gap:10px;padding:4px 10px 4px 4px;border-radius:12px;border:1px solid var(--line);background:none;text-align:left}
.av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#307FE2,#71C5EB);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:600}
.user small{display:block;color:var(--mute);font-size:11px}
.content{flex:1;overflow:auto;padding:24px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:15px;margin:0}
.sub{color:var(--mute);margin:0 0 18px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.g{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi{cursor:pointer;transition:border-color .15s}.kpi:hover{border-color:var(--blue2)}
.kpi small{color:var(--mute);font-size:12.5px}.kpi b{display:block;font-size:26px;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.kpi em{font-style:normal;font-size:12px}
.row2{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
@media(max-width:1000px){.row2{grid-template-columns:1fr}}
.ch{display:flex;align-items:center;gap:10px;margin-bottom:14px}.ch .sp{flex:1}
.ch p{margin:2px 0 0;font-size:12px;color:var(--mute)}
.fig{position:relative;height:250px}.fig svg{position:absolute;inset:0;width:100%;height:100%}
.leg{display:flex;gap:14px;font-size:12px;color:var(--mute)}.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.bar{cursor:pointer;padding:6px 0}.bar:hover .bl{color:var(--blue2)}
.bl{display:flex;justify-content:space-between;gap:12px;font-size:13px;margin-bottom:5px}.bl b{font-variant-numeric:tabular-nums}
.bt{height:8px;border-radius:9px;background:var(--head);overflow:hidden}.bt i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#0857C3,#307FE2)}
/* buttons, chips */
.btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:500;white-space:nowrap}
.btn:hover{background:var(--head)}.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}.btn.pri:hover{background:#0648a3}
.btn.dan{color:var(--err);border-color:var(--err)}.btn.sm{height:30px;padding:0 10px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.ib:focus-visible,input:focus-visible,select:focus-visible,.chip:focus-visible{outline:2px solid var(--blue2);outline-offset:2px}
.tabs{display:inline-flex;background:var(--head);padding:4px;border-radius:11px;gap:2px}
.tabs button{border:0;background:none;padding:7px 14px;border-radius:8px;color:var(--mute);font-weight:500}
.tabs button.on{background:var(--card);color:var(--blue2);box-shadow:0 1px 3px #0002}
.bar2{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.search{flex:1 1 280px;display:flex;align-items:center;gap:8px;height:38px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--card)}
.search input{border:0;outline:0;background:none;flex:1;font-size:14px}
.chip{position:relative;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:13px;cursor:pointer;white-space:nowrap}
.chip.act{border-color:var(--blue2);background:var(--sky);color:var(--blue2);font-weight:500}
.menu{max-height:360px;overflow:auto;position:absolute;top:calc(100% + 6px);left:0;z-index:40;min-width:220px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px #0003;padding:6px;cursor:default;font-weight:400;color:var(--ink)}
.menu label{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:8px;cursor:pointer}.menu label:hover{background:var(--head)}
.menu .mf{display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:4px;padding:8px 6px 2px}
.menu input[type=checkbox]{accent-color:var(--blue);width:16px;height:16px}
.date{height:34px;border:1px solid var(--line);border-radius:99px;padding:0 12px;background:var(--card);font-size:13px}
.link{background:none;border:0;color:var(--blue2);font-weight:500;padding:4px}
/* grid table */
.tw{overflow:auto;border:1px solid var(--grid);border-radius:10px;background:var(--card);max-height:calc(100vh - 330px)}
table.x{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
.x th,.x td{border-right:1px solid var(--grid);border-bottom:1px solid var(--grid);padding:8px 12px;text-align:left;white-space:nowrap}
.x th{position:sticky;top:0;background:var(--head);font-size:11.5px;font-weight:600;color:var(--mute);letter-spacing:.02em;z-index:2;cursor:pointer;user-select:none}
.x th:hover{color:var(--ink)}.x th .ar{opacity:.5;margin-left:4px}
.x tr td:first-child,.x tr th:first-child{position:sticky;left:0;z-index:1;background:inherit}
.x tr th:first-child{z-index:3;background:var(--head)}
.x tbody tr{background:var(--card)}.x tbody tr:hover{background:var(--sky)}
.x tbody tr.hl{background:var(--warnb)}
.x td.n{color:var(--null);font-style:italic}
.x td.num{text-align:right;font-variant-numeric:tabular-nums}
.x .rn{color:var(--mute);text-align:center;background:var(--head)!important;font-size:11px;width:44px}
.x td[contenteditable]{outline:0}.x td[contenteditable]:focus{box-shadow:inset 0 0 0 2px var(--blue2)}
.x td.ce{background:var(--errb)}.x td.cw{background:var(--warnb)}
.badge{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:99px;font-size:11.5px;font-weight:600;white-space:nowrap}
.b-ok{background:var(--okb);color:var(--ok)}.b-w{background:var(--warnb);color:var(--warn)}.b-e{background:var(--errb);color:var(--err)}
.b-m{background:var(--head);color:var(--mute)}.b-b{background:var(--sky);color:var(--blue2)}
.pg{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;padding-top:12px;color:var(--mute);font-size:13px}
.pg .pb{display:flex;gap:4px;align-items:center}.pg button{min-width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--card)}
.pg button.on{background:var(--blue);color:#fff;border-color:var(--blue)}.pg select{height:32px;border-radius:8px;border:1px solid var(--line);background:var(--card)}
/* drawer, modal */
.scrim{position:fixed;inset:0;background:#0a172a55;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(540px,100vw);background:var(--card);z-index:61;transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column;box-shadow:-10px 0 40px #0003}
.drawer.on{transform:none}
.dh{padding:18px 22px;border-bottom:1px solid var(--line)}.db{flex:1;overflow:auto;padding:6px 22px 22px}.df{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.sec{padding:16px 0;border-bottom:1px solid var(--line)}.sec:last-child{border:0}
.sec h3{font-size:13px;margin:0 0 10px;display:flex;align-items:center;gap:8px;color:var(--blue2)}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:7px 12px;font-size:13px}.kv dt{color:var(--mute)}.kv dd{margin:0;font-weight:500}
.var{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.var .vh{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-bottom:6px}
.var ul{margin:0;padding:0;list-style:none}.var li{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:13px;border-top:1px dashed var(--line)}
.var li:first-child{border:0}.var li small{color:var(--mute)}
.tl{position:relative;padding-left:20px}.tl::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl div{position:relative;padding:0 0 14px;font-size:13px}.tl div::before{content:"";position:absolute;left:-19px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--blue2);border:2px solid var(--card)}
.tl small{display:block;color:var(--mute)}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-48%);width:min(560px,94vw);max-height:88vh;overflow:auto;background:var(--card);border-radius:16px;z-index:70;padding:22px;opacity:0;pointer-events:none;transition:.2s;box-shadow:0 20px 60px #0004}
.modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.mscrim{z-index:69}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;font-size:13px}
.fld label{font-weight:500}.fld label i{color:var(--err);font-style:normal}
.fld input,.fld select,.fld textarea{height:40px;border:1px solid var(--line);border-radius:9px;padding:0 12px;background:var(--card);font-size:14px}
.fld textarea{height:80px;padding:10px 12px;resize:vertical}
.fld.bad input,.fld.bad select,.fld.bad textarea{border-color:var(--err)}.fld .em{color:var(--err);font-size:12px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 16px}
.mact{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}
pre.code{background:var(--head);border-radius:10px;padding:12px;max-height:300px;overflow:auto;font-size:12px}
.alert{display:flex;gap:10px;padding:12px 14px;border-radius:10px;font-size:13px;margin-bottom:12px}
.alert.w{background:var(--warnb);color:var(--warn)}.alert.e{background:var(--errb);color:var(--err)}.alert.i{background:var(--sky);color:var(--blue2)}
.alert b{display:block}
.toasts{position:fixed;bottom:20px;right:20px;z-index:90;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:10px;font-size:13px;box-shadow:0 8px 24px #0004;animation:tin .25s}
@keyframes tin{from{transform:translateY(10px);opacity:0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.steps{display:flex;gap:0;margin:8px 0 4px;overflow-x:auto}
.st{flex:1;min-width:100px;text-align:center;font-size:11.5px;color:var(--mute);position:relative;padding-top:28px}
.st::before{content:attr(data-n);position:absolute;top:0;left:50%;transform:translateX(-50%);width:22px;height:22px;border-radius:50%;background:var(--head);display:grid;place-items:center;font-weight:600;z-index:1}
.st::after{content:"";position:absolute;top:10px;left:-50%;right:50%;height:2px;background:var(--line)}.st:first-child::after{display:none}
.st.done{color:var(--ok)}.st.done::before{background:var(--ok);color:#fff}.st.done::after{background:var(--ok)}
.st.cur{color:var(--blue2);font-weight:600}.st.cur::before{background:var(--blue2);color:#fff}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:180px;border:2px dashed var(--grid);border-radius:14px;padding:30px;text-align:center;color:var(--mute);cursor:pointer}
.drop p{margin:0}.drop svg.i{width:28px;height:28px;color:var(--blue2)}
.drop:hover,.drop.ov{border-color:var(--blue2);background:var(--sky)}
.empty{text-align:center;padding:40px;color:var(--mute)}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}@media(max-width:1100px){.split{grid-template-columns:1fr}}
.list .li{display:flex;gap:12px;align-items:center;padding:12px;border-radius:10px;cursor:pointer;border:1px solid transparent}
.list .li:hover{background:var(--head)}.list .li.on{border-color:var(--blue2);background:var(--sky)}
.note{font-size:11.5px;color:var(--mute);margin-top:10px}
.lock{display:inline-flex;gap:5px;align-items:center;font-size:12px;color:var(--mute)}
.dd{position:relative}
@media(max-width:760px){.side{position:fixed;z-index:55;height:100vh}.content{padding:14px}.crumb span{display:none}.user div{display:none}}
</style>
</head>
<body>
<div class="app">
<aside class="side" id="side">
 <div class="brand"><div class="mark">BRI</div><div><b>BRI</b><small>WATCHLIST SYSTEM</small></div></div>
 <div class="navl">MENU UTAMA</div>
 <nav class="nav" id="nav"></nav>
 <div class="sfoot"><p id="scope"></p><button id="colBtn" title="Perkecil sidebar"><svg class="i"><use href="#i-chl"/></svg><span>Perkecil</span></button></div>
</aside>
<div class="main">
 <header class="top">
  <button class="ib" id="hideBtn" title="Tampilkan/sembunyikan sidebar" aria-label="Toggle sidebar"><svg class="i"><use href="#i-menu"/></svg></button>
  <div class="crumb"><span id="crumbA">WATCHLIST</span><b id="crumbB">Dashboard</b></div>
  <div class="sp"></div>
  <div class="dd"><button class="ib" id="notifBtn" aria-label="Notifikasi"><svg class="i"><use href="#i-bell"/></svg><i class="dot" id="ndot"></i></button><div class="menu" id="notifMenu" hidden style="left:auto;right:0;width:320px"></div></div>
  <div class="dd"><button class="user" id="userBtn"><span class="av" id="av">AA</span><div><b id="uname" style="font-size:13px">AML Administrator</b><small id="urole">AML Admin</small></div><svg class="i" style="width:14px"><use href="#i-down"/></svg></button><div class="menu" id="userMenu" hidden style="left:auto;right:0;width:260px"></div></div>
 </header>
 <main class="content" id="view"></main>
</div>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer"></aside>
<div class="scrim mscrim" id="mscrim"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true"></div>
<div class="toasts" id="toasts"></div>

<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="i-dash" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></symbol>
<symbol id="i-db" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></symbol>
<symbol id="i-in" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-ok" viewBox="0 0 24 24"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></symbol>
<symbol id="i-up" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></symbol>
<symbol id="i-hist" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l4 2"/></symbol>
<symbol id="i-set" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.8 1.2V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-2.8-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3.1 14H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.2-2.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 10 3.1V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 2.8 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0 1.2 2.8H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1.1z"/></symbol>
<symbol id="i-menu" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></symbol>
<symbol id="i-chl" viewBox="0 0 24 24"><path d="M11 17l-5-5 5-5M18 17l-5-5 5-5"/></symbol>
<symbol id="i-chr" viewBox="0 0 24 24"><path d="M13 17l5-5-5-5M6 17l5-5-5-5"/></symbol>
<symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></symbol>
<symbol id="i-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>

let ENT=[],VID=1,EID=0;
const newEid=()=>'WL-'+String(++EID).padStart(5,'0');

for(let i=1;i<=60;i++){
 const sub=pick(GEN),cat=catOf(sub);

  nik:isKD?(rnd()<.5?null:nik):nik,cif:rnd()<.5?'CIF'+Math.floor(rnd()*1e7):null,rek:!isKD&&rnd()<.6?'0'+Math.floor(rnd()*1e14):null,

 e.vars.push({vid:VID++,nama:n,alias:isKD&&rnd()<.6?n.split(' ')[0]+' alias '+pick(['Abu','Bang','Pak']):null,tempat:tl,tgl:dob,alamat:'Jl. '+pick(['Merdeka','Sudirman','Diponegoro','Gatot Subroto','Ahmad Yani'])+' No.'+(1+Math.floor(rnd()*90))+', '+tl,src,ref:'B-'+(100+i)+'/PPATK/2026',tglLapor:daysAgo(Math.floor(rnd()*200)+25)});
 if(nVar||aVar)e.vars.push({...e.vars[0],vid:VID++,nama:nVar?n.split(' ')[0]+' '+n.split(' ')[1][0]+'.':e.vars[0].nama,alamat:aVar?'Jl. '+pick(['Kenanga','Melati','Anggrek'])+' No.'+(1+Math.floor(rnd()*50))+', '+pick(CITIES):e.vars[0].alamat,src:src2,ref:'ND-'+(200+i)+'/UKA/2026'});

 ENT.push(e);

/* ---------- delisting engine ---------- */
const live=e=>e.vars.filter(v=>!v.del);
function delistVars(e,vids,why,by,t=new Date()){
 const sel=e.vars.filter(v=>vids.includes(v.vid)&&!v.del);if(!sel.length)return null;
 if(e.cat==='Rejection List'){
  sel.forEach(v=>{v.del=true});
  const ne={...e,id:newEid(),cat:'Negative List',sub:'Delisting Rejection List',status:'Active',origin:e.id,created:t,updated:t,
   vars:sel.map(v=>({...v,vid:VID++,del:false,orig:v.src,origVid:v.vid,src:'DELISTING - '+v.src})),
   hist:[{t,a:'Created (delisting)',u:by,r:'Dari '+e.id+' (Rejection List) · '+why}]};
  ne.name=ne.vars[0].nama;ENT.push(ne);
  if(!live(e).length)e.status='Delisted';e.updated=t;
  e.hist.push({t,a:live(e).length?'Partial delisting':'Delisted',u:by,r:sel.length+' variasi → '+ne.id+' (Negative List) · '+why});
  return ne}
 if(e.cat==='Negative List'){
  if(sel.length===live(e).length){e.prevSub=e.sub;e.cat='Delisting Akhir';e.sub='Delisting Akhir';e.status='Delisted';e.updated=t;e.hist.push({t,a:'Delisting Akhir',u:by,r:'Keluar dari Rejection & Negative List · '+why});return e}
  e.vars=e.vars.filter(v=>!vids.includes(v.vid));e.updated=t;
  const ne={...e,id:newEid(),cat:'Delisting Akhir',sub:'Delisting Akhir',prevSub:e.sub,status:'Delisted',splitFrom:e.id,created:t,updated:t,vars:sel,origin:null,
   hist:[{t,a:'Delisting Akhir',u:by,r:'Partial dari '+e.id+' · '+why}]};ne.name=ne.vars[0].nama;ENT.push(ne);
  e.hist.push({t,a:'Partial delisting',u:by,r:sel.length+' variasi → '+ne.id+' (Delisting Akhir) · '+why});return ne}
}
function restoreToRejection(ne,why,by,t=new Date()){
 const o=ENT.find(x=>x.id===ne.origin);if(!o)return;
 ne.vars.forEach(v=>{const ov=o.vars.find(x=>x.vid===v.origVid);if(ov)ov.del=false});
 o.status='Active';o.updated=t;o.hist.push({t,a:'Dikembalikan ke Rejection List',u:by,r:'Dari '+ne.id+' · '+why});
 ne.status='Inactive';ne.restored=true;ne.updated=t;ne.hist.push({t,a:'Dikembalikan ke Rejection List',u:by,r:'Record dinonaktifkan, variasi aktif kembali di '+o.id+' · '+why});
}

let trendRO;
function drawTrend(){
 const box=$('#trend');if(!box)return;const s=box.querySelector('svg');
 const M=['Des','Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov'];
 const A=[820,940,760,1120,980,1340,1210,1480,1390,1620,1540,1710],D=[120,90,140,110,160,130,180,150,170,140,210,190];
 const k=+period,m=M.slice(-k),a=A.slice(-k),d=D.slice(-k);
 const draw=()=>{const W=s.clientWidth,H=s.clientHeight;if(!W)return;const L=44,B=26,T=10,max=2000,iw=W-L-8,ih=H-B-T,bw=iw/k;
  let g='';for(let v=0;v<=max;v+=500){const y=T+ih-v/max*ih;g+=`<line x1="${L}" x2="${W-8}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L-8}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--mute)">${fmt(v)}</text>`}
  m.forEach((mm,i)=>{const x=L+i*bw,w=Math.min(18,bw*.3),ha=a[i]/max*ih,hd=d[i]/max*ih;
   g+=`<rect x="${x+bw/2-w-1}" y="${T+ih-ha}" width="${w}" height="${ha}" rx="3" fill="var(--blue)"><title>${mm}: +${fmt(a[i])}</title></rect><rect x="${x+bw/2+1}" y="${T+ih-hd}" width="${w}" height="${hd}" rx="3" fill="var(--mentari)"><title>${mm}: −${fmt(d[i])}</title></rect>`;
   if(W>520||i%2===0)g+=`<text x="${x+bw/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--mute)">${mm}</text>`});
  s.innerHTML=g};
 if(trendRO)trendRO.disconnect();trendRO=new ResizeObserver(draw);trendRO.observe(s);draw();
}

let F,wv='item',q='',asof='',sort={k:'id',d:1},pg=1,per=10,hlId=null;

const FDEF=[['cat','Kategori',()=>ALLCATS.filter(c=>SUBC[c].some(x=>ROLE.scope.includes(x)))],['sub','Subkategori',()=>ROLE.scope.filter(x=>x!=='Delisting Akhir')],['src','Sumber Data',()=>[...new Set(ENT.filter(inScope).flatMap(e=>e.vars.map(v=>v.src)))].sort()],['status','Status',()=>['Active','Inactive','Delisted']],['unit','PIC Group',()=>UNITS]];

 const qq=q.toLowerCase();

  &&(!F.src.size||e.vars.some(v=>F.src.has(v.src)))&&(!asof||e.created<=new Date(asof))
  &&(!qq||[e.id,e.key,e.nik,e.cif,...e.vars.flatMap(v=>[v.nama,v.alias])].some(x=>x&&String(x).toLowerCase().includes(qq))));

 `<input type="date" class="date" id="asof" value="${asof}" title="As-of date" aria-label="As-of date">`+

function bindChips(rerender){
 document.querySelectorAll('.chip[data-f]').forEach(ch=>ch.onclick=e=>{
  if(e.target.closest('.menu'))return;e.stopPropagation();const k=ch.dataset.f,opts=FDEF.find(d=>d[0]===k)[2]();
  let m=ch.querySelector('.menu');if(m){m.remove();return}closeMenus();document.querySelectorAll('.chip .menu').forEach(x=>x.remove());
  m=document.createElement('div');m.className='menu';const tmp=new Set(F[k]);
  m.innerHTML=(opts.length>8?`<input class="date" style="width:100%;border-radius:8px;margin-bottom:4px" placeholder="Cari…" data-q>`:'')+opts.map(o=>`<label><input type="checkbox" value="${esc(o)}" ${tmp.has(o)?'checked':''}> ${esc(o)}</label>`).join('')+`<div class="mf"><button class="link" data-c>Hapus</button><button class="btn pri sm" data-a>Terapkan</button></div>`;
  ch.append(m);const mq=m.querySelector('[data-q]');if(mq){mq.focus();mq.oninput=()=>m.querySelectorAll('label').forEach(l=>l.hidden=!l.textContent.toLowerCase().includes(mq.value.toLowerCase()))}

const mst=k=>MSTAT[mTab+'|'+k]||'Active';
function mForm(title,fields,onSave){
 openModal(`<h2>${esc(title)}</h2><form id="mf" novalidate style="margin-top:14px">${fields.map(f=>`<div class="fld"><label>${f.l}${f.req?' <i>*</i>':''}</label>${
  f.t==='select'?`<select name="${f.n}">${f.o.map(o=>`<option ${o===f.v?'selected':''}>${esc(o)}</option>`).join('')}</select>`
  :f.t==='checks'?`<div class="var" style="margin:0;max-height:200px;overflow:auto">${f.o.map(o=>`<label style="display:flex;gap:8px;padding:3px 0;font-weight:400"><input type="checkbox" name="${f.n}" value="${esc(o)}" ${(f.v||[]).includes(o)?'checked':''}> ${esc(o)}</label>`).join('')}</div>`
  :`<input name="${f.n}" value="${esc(f.v||'')}">`}</div>`).join('')}
 <div class="mact"><button type="button" class="btn" data-x>Batal</button><button class="btn pri">Simpan</button></div></form>`);
 $('#modal').querySelector('[data-x]').onclick=closeModal;
 $('#mf').onsubmit=ev=>{ev.preventDefault();const f=ev.target,d={};let ok=true;
  fields.forEach(x=>{const w=f.querySelector(`[name="${x.n}"]`).closest('.fld');w.classList.remove('bad');w.querySelector('.em')?.remove();
   d[x.n]=x.t==='checks'?[...f.querySelectorAll(`[name="${x.n}"]:checked`)].map(c=>c.value):f[x.n].value.trim();
   if(x.req&&!d[x.n].length){ok=false;w.classList.add('bad');w.insertAdjacentHTML('beforeend','<span class="em">Wajib diisi</span>')}});
  if(!ok)return;const err=onSave(d);if(err){toast(err);return}closeModal();vMaster()};
}
function renameEverywhere(kind,old,nw){
 if(kind==='cat'){SUBC[nw]=SUBC[old];delete SUBC[old];[CATS,ALLCATS].forEach(a=>{const i=a.indexOf(old);if(i>=0)a[i]=nw});ENT.forEach(e=>{if(e.cat===old)e.cat=nw})}
 if(kind==='sub'){const c=catOf(old);SUBC[c][SUBC[c].indexOf(old)]=nw;SRC[nw]=SRC[old];delete SRC[old];TOT[nw]=TOT[old]||0;if(MANDO[old])MANDO[nw]=MANDO[old];ENT.forEach(e=>{if(e.sub===old)e.sub=nw});Object.values(ROLES).forEach(r=>{const i=r.scope.indexOf(old);if(i>=0)r.scope[i]=nw})}
 if(kind==='src'){Object.values(SRC).forEach(a=>{const i=a.indexOf(old);if(i>=0)a[i]=nw});ENT.forEach(e=>e.vars.forEach(v=>{if(v.src===old)v.src=nw;if(v.orig===old)v.orig=nw}));if(SKEY[old]){SKEY[nw]=SKEY[old];delete SKEY[old]}}
 SOURCES=[...new Set(Object.values(SRC).flat())];
}
function vMaster(){
 const aml=roleKey==='aml';
 const T={cat:'Category',sub:'Subcategory',src:'Source',dict:'Data Dictionary',user:'User & Role'};
 const allSubs=CATS.flatMap(c=>SUBC[c]);
 $('#view').innerHTML=`<div style="display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:16px"><div style="flex:1"><h1>Master Data &amp; Administration</h1><p class="sub" style="margin:0">${aml?'Super administrator: tambah, ubah, dan nonaktifkan master data langsung. Semua perubahan tercatat di Audit Trail.':'Hanya-baca untuk role Anda.'}</p></div>
 <div class="tabs" id="mt">${Object.entries(T).map(([k,l])=>`<button data-t="${k}" class="${mTab===k?'on':''}">${l}</button>`).join('')}</div></div><div class="card" id="mb"></div>`;
 $('#mt').onclick=e=>{const b=e.target.closest('button');if(b){mTab=b.dataset.t;vMaster()}};
 let head,rows;
 if(mTab==='cat'){head=['KATEGORI','IKUT PATCHING','STATUS'];rows=ALLCATS.map(c=>({k:c,c:[c,c==='Delisting Akhir'?'Tidak':'Ya'],lock:c==='Delisting Akhir'}))}
 if(mTab==='sub'){head=['SUBKATEGORI','KATEGORI','STATUS'];rows=allSubs.map(x=>({k:x,c:[x,catOf(x)]}))}
 if(mTab==='src'){head=['SUMBER','PRIMARY KEY','SUBKATEGORI','KATEGORI','STATUS'];rows=allSubs.flatMap(x=>SRC[x].map(z=>({k:z,sub:x,c:[z,keyOfSrc(z),x,catOf(x)]})))}
 if(mTab==='dict'){head=['FIELD','LABEL','TIPE ATRIBUT','FORMAT','WAJIB DI SUBKATEGORI','STATUS'];rows=DICT.map(([k,l,t,f])=>({k,c:[k,l,t,f,(()=>{const w=allSubs.filter(x=>MAND[x].includes(k));return w.length===allSubs.length?'Semua':w.length?w.join(', '):'—'})()]}))}
 if(mTab==='user'){head=['USER','GROUP','SCOPE DATA','ROLE (AKSI)','STATUS'];rows=USERS.map(u=>({k:u.n,c:[u.n,u.g,u.sc,u.r]}))}
 $('#mb').innerHTML=`<div class="bar2"><label class="search" style="flex:0 1 360px">${ic('search')}<input id="mq" placeholder="Cari ${T[mTab].toLowerCase()}…"></label><div style="flex:1"></div>${aml?`<button class="btn pri" id="madd">${ic('in')}Tambah ${T[mTab]}</button>`:`<span class="lock">${ic('lock')}Hanya-baca</span>`}</div>
 <div class="tw"><table class="x"><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}${aml?'<th>ACTION</th>':''}</tr></thead><tbody>${rows.map((r,i)=>`<tr data-r="${i}" data-txt="${esc(r.c.join(' ').toLowerCase())}">${r.c.map(v=>`<td style="white-space:normal;max-width:420px">${esc(v)}</td>`).join('')}<td>${stBadge(mst(r.k))}</td>${aml?`<td>${r.lock?'<span class="lock">'+ic('lock')+'Sistem</span>':`<button class="link" data-ed="${i}">Edit</button> <button class="link" data-tg="${i}" style="color:var(--${mst(r.k)==='Active'?'err':'ok'})">${mst(r.k)==='Active'?'Nonaktifkan':'Aktifkan'}</button>`}</td>`:''}</tr>`).join('')}</tbody></table></div>
 <p class="note">${rows.length} ${T[mTab].toLowerCase()}. ${mTab==='src'?'Sumber terikat ke satu subkategori.':mTab==='dict'?'Mandatory field diatur per subkategori.':'Item nonaktif tidak bisa dipilih di Submit Data, tapi data lamanya tetap tersimpan.'}</p>`;
 $('#mq').oninput=e=>{const v=e.target.value.toLowerCase();document.querySelectorAll('#mb tr[data-txt]').forEach(t=>t.hidden=!t.dataset.txt.includes(v))};
 if(!aml)return;
 const done=(a,k)=>{log('Master data '+a,T[mTab],k);toast(T[mTab]+' "'+k+'" '+a)};
 document.querySelectorAll('[data-tg]').forEach(b=>b.onclick=()=>{const r=rows[+b.dataset.tg],id=mTab+'|'+r.k;MSTAT[id]=mst(r.k)==='Active'?'Inactive':'Active';done(MSTAT[id]==='Active'?'diaktifkan':'dinonaktifkan',r.k);vMaster()});
 const edit=r=>{
  if(mTab==='cat')mForm(r?'Ubah kategori':'Tambah kategori',[{n:'n',l:'Nama kategori',v:r?.k,req:1}],d=>{if(r){if(d.n!==r.k){if(SUBC[d.n])return 'Nama sudah dipakai';renameEverywhere('cat',r.k,d.n)}done('diubah',d.n)}else{if(SUBC[d.n])return 'Kategori sudah ada';SUBC[d.n]=[];CATS.push(d.n);ALLCATS.splice(ALLCATS.length-1,0,d.n);done('ditambahkan',d.n)}});
  if(mTab==='sub')mForm(r?'Ubah subkategori':'Tambah subkategori',[{n:'n',l:'Nama subkategori',v:r?.k,req:1},{n:'c',l:'Kategori',t:'select',o:CATS,v:r?catOf(r.k):CATS[0]}],d=>{
   if(r){if(d.n!==r.k){if(SRC[d.n])return 'Nama sudah dipakai';renameEverywhere('sub',r.k,d.n)}const oc=catOf(d.n);if(oc!==d.c){SUBC[oc].splice(SUBC[oc].indexOf(d.n),1);SUBC[d.c].push(d.n);ENT.forEach(e=>{if(e.sub===d.n)e.cat=d.c})}done('diubah',d.n)}
   else{if(SRC[d.n])return 'Subkategori sudah ada';SUBC[d.c].push(d.n);SRC[d.n]=[];TOT[d.n]=0;ROLES.aml.scope.push(d.n);done('ditambahkan',d.n)}});
  if(mTab==='src')mForm(r?'Ubah sumber':'Tambah sumber',[{n:'n',l:'Nama sumber',v:r?.k,req:1},{n:'key',l:'Primary key',t:'select',o:['NIK','Kode Dugaan'],v:r?keyOfSrc(r.k):'NIK'},{n:'s',l:'Subkategori',t:'select',o:allSubs,v:r?.sub||allSubs[0]}],d=>{
   if(r){if(d.n!==r.k)renameEverywhere('src',r.k,d.n);if(d.s!==r.sub){SRC[r.sub].splice(SRC[r.sub].indexOf(d.n),1);SRC[d.s].push(d.n)}}else{if(SRC[d.s].includes(d.n))return 'Sumber sudah ada di subkategori ini';SRC[d.s].push(d.n)}
   if(r&&d.n!==r.k)delete SKEY[r.k];SKEY[d.n]=d.key;SOURCES=[...new Set(Object.values(SRC).flat())];done(r?'diubah':'ditambahkan',d.n)});
  if(mTab==='dict'){const row=r?DICT.find(x=>x[0]===r.k):null;mForm(r?'Ubah field '+r.k:'Tambah field',[...(r?[]:[{n:'k',l:'Nama field (kode)',req:1}]),{n:'l',l:'Label',v:row?.[1],req:1},{n:'t',l:'Tipe atribut',t:'select',o:['Common','Subkategori-specific'],v:row?.[2]},{n:'f',l:'Format',t:'select',o:['Teks','Angka','Tanggal','16 digit','Master: Source'],v:row?.[3]},{n:'m',l:'Wajib di subkategori',t:'checks',o:allSubs,v:allSubs.filter(x=>MAND[x].includes(r?.k))}],d=>{
   const k=r?r.k:d.k.toLowerCase().replace(/\W+/g,'_');if(!r&&DICT.some(x=>x[0]===k))return 'Field sudah ada';
   if(r)Object.assign(row,[k,d.l,d.t,d.f]);else{DICT.push([k,d.l,d.t,d.f]);FIELDS[k]=d.l}
   allSubs.forEach(x=>{const cur=[...MAND[x]].filter(y=>y!==k);MANDO[x]=d.m.includes(x)?[...cur,k]:cur});done(r?'diubah':'ditambahkan',k)})}
  if(mTab==='user'){const u=r?USERS.find(x=>x.n===r.k):null;mForm(r?'Ubah user':'Tambah user',[{n:'n',l:'Nama user',v:u?.n,req:1},{n:'g',l:'Group',t:'select',o:UNITS.concat('Auditor'),v:u?.g},{n:'sc',l:'Scope data (subkategori)',t:'checks',o:allSubs,v:u?(u.sc==='Semua subkategori'?allSubs:u.sc.split(', ')):[],req:1},{n:'r',l:'Role',t:'select',o:ROLESL,v:u?.r}],d=>{
   const rec={n:d.n,g:d.g,sc:d.sc.length===allSubs.length?'Semua subkategori':d.sc.join(', '),r:d.r};if(u)Object.assign(u,rec);else{if(USERS.some(x=>x.n===d.n))return 'User sudah ada';USERS.push(rec)}done(u?'diubah':'ditambahkan',d.n)})}
 };
 $('#madd').onclick=()=>edit(null);
 document.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>edit(rows[+b.dataset.ed]));
}

/* ---------- start ---------- */
const h=location.hash.slice(1);if(TITLES[h])page=h;
addEventListener('hashchange',()=>{const p=location.hash.slice(1);if(TITLES[p]&&p!==page){page=p;render()}});
render();
}
</script>
</body>
</html>
